<section id="preview-layers" aria-label="Preview image layers"><div class="preview-layer-heading"><strong>LAYERS</strong><div><button class="btn" type="button" data-preview-action="add" title="Add image layer" aria-label="Add image layer">+</button><button class="btn" type="button" data-preview-action="replace">Replace image</button><button class="btn" type="button" data-preview-action="rename">Rename</button><button class="btn" type="button" data-preview-action="remove" title="Remove selected image layer" aria-label="Remove selected image layer">−</button><button class="btn" type="button" data-preview-action="up" title="Move layer forward" aria-label="Move layer forward">↑</button><button class="btn" type="button" data-preview-action="down" title="Move layer backward" aria-label="Move layer backward">↓</button></div></div><form id="preview-layer-rename" hidden><label class="sr-only" for="preview-layer-name">Layer name</label><input id="preview-layer-name" class="form-control" maxlength="80" required autocomplete="off"><button class="btn" type="submit">Save</button><button class="btn" type="button" data-preview-action="rename-cancel">Cancel</button></form><div class="preview-layer-settings"><label class="sr-only" for="preview-blend">Blend mode</label><select id="preview-blend" class="form-select"><option value="normal">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="add">Add</option></select><label for="preview-opacity">Opacity</label><input id="preview-opacity" class="form-range" type="range" min="0" max="100" step="1" value="100"><output id="preview-opacity-value">100%</output></div><div id="preview-layer-list" aria-label="Image layer stack"></div><p id="preview-layer-status" hidden role="status" aria-live="polite"></p><input id="preview-layer-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></section>
