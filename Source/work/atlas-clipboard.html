<dialog id="clipboard-dialog" class="studio-png-dialog studio-clipboard-dialog" aria-labelledby="clipboard-title" aria-describedby="clipboard-manual-status"><header><h2 id="clipboard-title">Copy manually</h2><button class="btn" type="button" data-action="clipboard-close" aria-label="Close manual copy">×</button></header><p id="clipboard-manual-status" role="status" aria-live="polite"></p><label class="sr-only" for="clipboard-text">Text to copy</label><textarea id="clipboard-text" class="form-control" rows="4" readonly spellcheck="false"></textarea><footer><button class="btn" type="button" data-action="clipboard-retry">Try again</button><button class="btn" type="button" data-action="clipboard-close-secondary">Close</button></footer></dialog>
